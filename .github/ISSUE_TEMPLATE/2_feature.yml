name: 기능 요청 (Feature Request)
description: 지금은 없는 새로운 기능을 추가합니다.
title: "[Feat] "
labels: ["enhancement"]
type: Feature
body:
  - type: textarea
    id: background
    attributes:
      label: 배경 / 목적
      description: 왜 필요한가요? 누가 요청했고, 지금은 어떤 점이 불편한가요?
      placeholder: |
        예)
        [프론트] 고객이 월별 트래픽 사용량을 보려면 매번 운영팀에 요청해야 함 (월 30건 이상)
        [백엔드] 외부 연동 업체가 서버 상태를 확인할 API가 없어 담당자가 메일로 전달 중
        [네트워크] 포트 사용률이 한계에 가까워져도 고객 문의가 온 뒤에야 알게 됨
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: 원하는 동작 / 완료 조건
      description: 어떻게 동작하면 되는지 확인할 수 있는 형태로 한 줄에 하나씩 적어주세요. 시안이나 구성도가 있으면 함께 첨부해 주세요.
      placeholder: |
        예)
        - [ ] [프론트] 콘솔 > 트래픽 화면에서 월을 고르면 일별 사용량 그래프와 월 합계 표시
        - [ ] [백엔드] GET /v1/servers/{id}/status로 상태 조회, 다른 고객의 서버면 403 응답
        - [ ] [네트워크] 포트 사용률이 5분 평균 80%를 넘으면 담당자에게 알림 (같은 포트는 30분에 한 번)
    validations:
      required: true
