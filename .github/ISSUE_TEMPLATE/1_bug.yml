name: 버그 신고 (Bug Report)
description: 예상과 다르게 동작하거나 오류가 발생하는 문제를 신고합니다.
title: "[Bug] "
labels: ["bug"]
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        > **서비스 장애가 진행 중이라면** 이슈를 쓰기 전에 장애 대응 채널에 먼저 알려주세요.

  - type: textarea
    id: symptom
    attributes:
      label: 현상
      description: 무엇이 잘못됐나요? 언제부터, 얼마나 자주 발생하는지 적어주세요. 스크린샷은 이 칸에 끌어다 놓으면 첨부됩니다.
      placeholder: |
        예)
        [프론트] 11/5 배포 후 서버 목록에서 2페이지를 눌러도 1페이지가 그대로 보임 (매번)
        [백엔드] 11/5 배포 후 GET /v1/servers가 간헐적으로 500 응답 (시간당 약 20건)
        [네트워크] 11/12부터 매일 21~23시 core-sw-01 ↔ core-sw-02 구간 패킷 손실 2~5% (평소 0%)
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 재현 / 확인 방법
      description: 다른 사람이 따라 할 수 있게 순서대로 적어주세요. 간헐적인 문제라면 확인한 방법과 결과를 적어주세요.
      placeholder: |
        예)
        [프론트] 일반 고객 계정으로 로그인 → 서버 > 서버 목록 → 2페이지 클릭
        [백엔드] GET https://api.example.com/v1/servers 100회 호출 → 2~3회 500 응답
        [네트워크] 21시에 203.0.113.10 → 198.51.100.20 ping 1,000회 → 손실 3.2%
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: 발생 환경
      multiple: true
      options:
        - 운영
        - 스테이징
        - 개발
        - 로컬
        - 테스트베드 / 랩
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 로그 / 버전 정보
      description: 에러 로그, 버전, 장비 정보 등이 있으면 그대로 붙여넣어 주세요. 비밀번호·토큰·장비 접속 정보는 지워주세요.
      placeholder: |
        예)
        [프론트] v2.4.1 / Chrome 131 / Uncaught TypeError: Cannot read properties of undefined (reading 'items')
        [백엔드] api-server v1.8.0 / ERROR [ServerController] NullPointerException at ServerService.java:142
        [네트워크] core-sw-01 (NX-OS 10.3(4a)) / %ETHPORT-5-IF_DOWN_LINK_FAILURE: Interface Ethernet1/49 is down
      render: text
